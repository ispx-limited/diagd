# bird2 example: announce an anycast service address while this diagd
# instance is healthy. The anycast address is configured on a loopback:
#
#   ip addr add 198.51.100.1/32 dev lo
#
# and diagd binds it:
#
#   diagd serve -http 198.51.100.1:8080 -echo 198.51.100.1:9000 \
#       -tr471 198.51.100.1:24601 -ops 127.0.0.1:9143
#
# The companion health check (anycast-healthcheck.sh, run from a systemd
# timer every few seconds) enables or disables the static protocol, which
# announces or withdraws the route. Withdraw on failure, not on load;
# admission control handles load.

log syslog all;
router id 192.0.2.10;

protocol device {
}

protocol static anycast_diagd {
    ipv4;
    route 198.51.100.1/32 blackhole;
}

protocol bgp core {
    description "POP core router";
    local as 65010;
    neighbor 192.0.2.1 as 65000;
    ipv4 {
        import none;
        export where proto = "anycast_diagd";
    };
}
