site_name: diagd
site_description: A network test server for CPE broadband diagnostics, implementing the server side of TR-143 and TR-471.
site_url: https://ispx-limited.github.io/diagd/
copyright: Copyright &copy; ISPX LIMITED

theme:
  name: shadcn
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark

plugins:
  - search

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  tables:
  attr_list:
  md_in_html:
  toc:
    permalink: true
  pymdownx.blocks.details:
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.snippets:
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/js/copy-code.js

nav:
  - Home: index.md
  - Guides:
      - Quickstart: guides/quickstart.md
  - Architecture: architecture.md
  - Deployment: deployment.md
